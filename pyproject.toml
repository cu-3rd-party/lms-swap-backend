[project]
name = "lms-swap-backend"
version = "0.1.0"
description = "Биржа обмена парами для расширения CU LMS Enhancer"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: Depends()/Query() в дефолтах аргументов — это то, как устроен FastAPI.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["E501", "UP035", "UP007"]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]

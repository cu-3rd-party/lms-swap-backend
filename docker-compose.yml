services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: swap
      POSTGRES_PASSWORD: swap
      POSTGRES_DB: swap
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U swap']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://swap:swap@db:5432/swap
      MATCH_INTERVAL_SECONDS: 30
      LOG_LEVEL: INFO
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
